<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Block Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink: #12202b; --panel: rgba(18, 32, 43, 0.72); --accent: #ffd166; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8ecae6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  canvas { display: block; }

  #crosshair { position: fixed; left: 50%; top: 50%; width: 20px; height: 20px;
    transform: translate(-50%, -50%); pointer-events: none; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff;
    mix-blend-mode: difference; }
  #crosshair::before { left: 9px; top: 0; width: 2px; height: 20px; }
  #crosshair::after { top: 9px; left: 0; height: 2px; width: 20px; }

  #status { position: fixed; top: 12px; left: 12px; padding: 6px 12px; border-radius: 8px;
    background: var(--panel); font-size: 14px; pointer-events: none; }

  #hotbar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 6px; border-radius: 12px; background: var(--panel);
    pointer-events: none; }
  .slot { width: 44px; height: 44px; border-radius: 6px; border: 3px solid transparent;
    box-sizing: border-box; position: relative; }
  .slot.on { border-color: #fff; transform: translateY(-4px); }
  .slot span { position: absolute; left: 4px; top: 1px; font-size: 11px; font-weight: 700;
    color: #fff; text-shadow: 0 1px 2px #000; }

  .slot b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 400; }
  #hp { position: fixed; bottom: 22px; left: 16px; padding: 8px 14px; border-radius: 10px;
    background: var(--panel); font-weight: 700; pointer-events: none; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 20, 30, 0.55); cursor: pointer; }
  #overlay.hidden { display: none; }
  #card { max-width: 380px; padding: 28px 32px; border-radius: 14px; background: var(--ink);
    box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  #card h1 { margin: 0 0 4px; font-size: 26px; }
  #card p { margin: 0 0 16px; color: #b9c8d3; }
  #card dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0 0 20px; }
  #card dt { color: var(--accent); font-weight: 600; }
  #card dd { margin: 0; }
  #play { display: block; text-align: center; padding: 12px; border-radius: 8px;
    background: var(--accent); color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
<div id="status">Connecting…</div>
<div id="crosshair"></div>
<div id="hotbar"></div>
<div id="hp">❤ 100</div>
<div id="overlay">
  <div id="card">
    <h1>Block Platform</h1>
    <p>Build together on one shared platform.</p>
    <dl>
      <dt>W A S D</dt><dd>Move</dd>
      <dt>Space</dt><dd>Jump</dd>
      <dt>Shift</dt><dd>Run</dd>
      <dt>Left click</dt><dd>Break block / fire / throw</dd>
      <dt>Right click</dt><dd>Place block</dd>
      <dt>1–8</dt><dd>Block colours</dd>
      <dt>9 / 0</dt><dd>Gun / Grenade</dd>
      <dt>Wheel</dt><dd>Cycle items</dd>
      <dt>Esc</dt><dd>Release mouse</dd>
    </dl>
    <div id="play">Click to play</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // Index 0-7 are the hotbar colours, 8-9 are the platform checkerboard.
  const PALETTE = [0xe63946, 0xf4a261, 0xffd166, 0x2a9d8f, 0x3a86ff, 0x8338ec, 0xf1f1f1, 0x2b2d42, 0x6b8f71, 0x7ea483];
  const BLOCK_SLOTS = 8, GUN = 8, GRENADE = 9, HOTBAR = 10, MAX_HP = 100;

  // ---------- Three.js setup ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const SKY = 0x8ecae6;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 40, 130);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 300);
  camera.rotation.order = "YXZ";

  scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.6);
  sun.position.set(0.5, 1, 0.3);
  scene.add(sun);

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- Blocks ----------
  const blockGeo = new THREE.BoxGeometry(1, 1, 1);
  const materials = {};
  const matFor = (c) => (materials[c] ||= new THREE.MeshLambertMaterial({ color: PALETTE[c] }));

  const world = new THREE.Group();
  scene.add(world);
  const blocks = new Map(); // "x,y,z" -> mesh
  const key = (x, y, z) => `${x},${y},${z}`;

  function addBlock(x, y, z, c) {
    removeBlock(x, y, z);
    const mesh = new THREE.Mesh(blockGeo, matFor(c));
    mesh.position.set(x, y, z);
    mesh.userData = { x, y, z };
    world.add(mesh);
    blocks.set(key(x, y, z), mesh);
  }
  function removeBlock(x, y, z) {
    const k = key(x, y, z);
    const mesh = blocks.get(k);
    if (mesh) { world.remove(mesh); blocks.delete(k); }
  }
  function clearBlocks() {
    for (const mesh of blocks.values()) world.remove(mesh);
    blocks.clear();
  }

  // Outline around the block you're aiming at
  const outline = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(1.01, 1.01, 1.01)),
    new THREE.LineBasicMaterial({ color: 0x000000 })
  );
  outline.visible = false;
  scene.add(outline);

  // ---------- Other players ----------
  const others = new Map(); // id -> { group, target }

  function makeAvatar(color) {
    const g = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color });
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.4), mat);
    body.position.y = 0.6;
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat);
    head.position.y = 1.45;
    const face = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.05),
      new THREE.MeshBasicMaterial({ color: 0x12202b }));
    face.position.set(0, 1.5, -0.26); // front is -Z
    g.add(body, head, face);
    return g;
  }
  function addPlayer(p) {
    if (others.has(p.id)) return;
    const group = makeAvatar(p.color);
    group.traverse((m) => (m.userData.pid = p.id));
    group.position.set(p.x, p.y, p.z);
    group.rotation.y = p.ry;
    scene.add(group);
    others.set(p.id, { group, target: { x: p.x, y: p.y, z: p.z, ry: p.ry } });
    updateStatus();
  }
  function removePlayer(id) {
    const o = others.get(id);
    if (o) { scene.remove(o.group); others.delete(id); updateStatus(); }
  }
  function clearPlayers() {
    for (const o of others.values()) scene.remove(o.group);
    others.clear();
  }

  // ---------- Held items, effects, grenades ----------
  scene.add(camera); // so items parented to the camera get drawn
  const gunModel = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.5),
    new THREE.MeshLambertMaterial({ color: 0x3a3f4b }));
  gunModel.position.set(0.28, -0.24, -0.55);
  const nadeModel = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10),
    new THREE.MeshLambertMaterial({ color: 0x4f7a3a }));
  nadeModel.position.set(0.28, -0.24, -0.5);
  camera.add(gunModel, nadeModel);
  function updateHeld() {
    gunModel.visible = selected === GUN;
    nadeModel.visible = selected === GRENADE;
  }

  const fx = []; // short-lived visual effects
  function addFx(obj, life, tick) { scene.add(obj); fx.push({ obj, life, max: life, tick }); }
  function tracer(a, b) {
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]),
      new THREE.LineBasicMaterial({ color: 0xffe066, transparent: true }));
    addFx(line, 0.12, (o, f) => { o.material.opacity = f; });
  }
  function explosion(x, y, z) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0xff8c1a, transparent: true }));
    m.position.set(x, y, z);
    addFx(m, 0.4, (o, f) => { o.scale.setScalar(1 + (1 - f) * 2.6); o.material.opacity = f * 0.8; });
  }
  function updateFx(dt) {
    for (let i = fx.length - 1; i >= 0; i--) {
      const e = fx[i];
      e.life -= dt;
      if (e.life <= 0) {
        scene.remove(e.obj); e.obj.geometry.dispose(); e.obj.material.dispose(); fx.splice(i, 1);
      } else e.tick(e.obj, e.life / e.max);
    }
  }

  // Every client simulates thrown grenades; only the thrower reports the landing spot.
  const nades = new Map(); // id -> { mesh, p, v, age, mine }
  const nadeGeo = new THREE.SphereGeometry(0.14, 10, 8);
  const nadeMat = new THREE.MeshLambertMaterial({ color: 0x4f7a3a });
  function spawnNade(m) {
    const mesh = new THREE.Mesh(nadeGeo, nadeMat);
    mesh.position.set(m.x, m.y, m.z);
    scene.add(mesh);
    nades.set(m.nid, { mesh, p: new THREE.Vector3(m.x, m.y, m.z), v: new THREE.Vector3(m.vx, m.vy, m.vz),
      age: 0, mine: m.id === myId });
  }
  function dropNade(nid) {
    const n = nades.get(nid);
    if (n) { scene.remove(n.mesh); nades.delete(nid); }
  }
  function stepNades(dt) {
    for (const [nid, n] of nades) {
      n.age += dt;
      n.v.y -= 20 * dt;
      for (const a of ["x", "y", "z"]) {
        n.p[a] += n.v[a] * dt;
        if (blocks.has(key(Math.round(n.p.x), Math.round(n.p.y), Math.round(n.p.z)))) {
          n.p[a] -= n.v[a] * dt;
          n.v[a] *= -0.45;
          if (a === "y") { n.v.x *= 0.85; n.v.z *= 0.85; }
        }
      }
      n.mesh.position.copy(n.p);
      if (n.mine && (n.age >= 2.2 || n.p.y < -20)) {
        n.mine = false;
        send({ type: "explode", nid, x: n.p.x, y: n.p.y, z: n.p.z });
      }
      if (n.age > 4) dropNade(nid); // safety net if the "boom" never arrives
    }
  }

  // ---------- HUD ----------
  const hpEl = document.getElementById("hp");
  function setHp(v) { hpEl.textContent = "❤ " + Math.max(0, v); }
  const statusEl = document.getElementById("status");
  let connected = false;
  function updateStatus() {
    statusEl.textContent = connected
      ? `${others.size + 1} player${others.size ? "s" : ""} online`
      : "Reconnecting…";
  }

  let selected = 0;
  const hotbarEl = document.getElementById("hotbar");
  const slots = [];
  for (let i = 0; i < HOTBAR; i++) {
    const s = document.createElement("div");
    s.className = "slot";
    const label = i === 9 ? 0 : i + 1;
    if (i < BLOCK_SLOTS) {
      s.style.background = "#" + PALETTE[i].toString(16).padStart(6, "0");
      s.innerHTML = `<span>${label}</span>`;
    } else {
      s.style.background = "#2b2d42";
      s.innerHTML = `<span>${label}</span><b>${i === GUN ? "🔫" : "💣"}</b>`;
    }
    hotbarEl.appendChild(s);
    slots.push(s);
  }
  function select(i) {
    selected = (i + HOTBAR) % HOTBAR;
    slots.forEach((s, n) => s.classList.toggle("on", n === selected));
    updateHeld();
  }
  select(0);

  // ---------- Networking ----------
  let ws = null;
  let myId = 0;
  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}`);

    ws.onopen = () => { connected = true; updateStatus(); };
    ws.onclose = () => { connected = false; updateStatus(); setTimeout(connect, 2000); };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      switch (msg.type) {
        case "init":
          clearBlocks();
          clearPlayers();
          for (const [x, y, z, c] of msg.blocks) addBlock(x, y, z, c);
          for (const p of msg.players) addPlayer(p);
          myId = msg.id;
          setHp(MAX_HP);
          for (const nid of [...nades.keys()]) dropNade(nid);
          respawn();
          updateStatus();
          break;
        case "join": addPlayer(msg.player); break;
        case "leave": removePlayer(msg.id); break;
        case "move": {
          const o = others.get(msg.id);
          if (o) o.target = { x: msg.x, y: msg.y, z: msg.z, ry: msg.ry };
          break;
        }
        case "set": addBlock(msg.x, msg.y, msg.z, msg.c); break;
        case "del": removeBlock(msg.x, msg.y, msg.z); break;
        case "shot":
          tracer(new THREE.Vector3(msg.ox, msg.oy, msg.oz), new THREE.Vector3(msg.tx, msg.ty, msg.tz));
          break;
        case "nade": spawnNade(msg); break;
        case "boom":
          dropNade(msg.nid);
          for (const [x, y, z] of msg.del) removeBlock(x, y, z);
          explosion(msg.x, msg.y, msg.z);
          break;
        case "hp": setHp(msg.hp); break;
        case "respawn": respawn(); break;
      }
    };
  }
  connect();

  // ---------- Player physics ----------
  const R = 0.3, H = 1.8, EYE = 1.6, EPS = 0.001;
  const pos = new THREE.Vector3(0, 3, 0);
  let vy = 0, onGround = false, yaw = 0, pitch = 0;

  function respawn() {
    pos.set((Math.random() - 0.5) * 6, 3, (Math.random() - 0.5) * 6);
    vy = 0;
  }

  // Blocks are unit cubes centred on integer coordinates.
  function collides(x, y, z) {
    const x0 = Math.floor(x - R + 0.5 + EPS), x1 = Math.floor(x + R + 0.5 - EPS);
    const y0 = Math.floor(y + 0.5 + EPS),     y1 = Math.floor(y + H + 0.5 - EPS);
    const z0 = Math.floor(z - R + 0.5 + EPS), z1 = Math.floor(z + R + 0.5 - EPS);
    for (let bx = x0; bx <= x1; bx++)
      for (let by = y0; by <= y1; by++)
        for (let bz = z0; bz <= z1; bz++)
          if (blocks.has(key(bx, by, bz))) return true;
    return false;
  }

  const keys = {};
  function step(dt) {
    const fwd = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
    const strafe = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    let dx = -Math.sin(yaw) * fwd + Math.cos(yaw) * strafe;
    let dz = -Math.cos(yaw) * fwd - Math.sin(yaw) * strafe;
    const len = Math.hypot(dx, dz);
    const speed = keys.ShiftLeft || keys.ShiftRight ? 8 : 5;
    if (len > 0) { dx = (dx / len) * speed * dt; dz = (dz / len) * speed * dt; }

    // Horizontal axes are resolved separately so you slide along walls.
    pos.x += dx; if (collides(pos.x, pos.y, pos.z)) pos.x -= dx;
    pos.z += dz; if (collides(pos.x, pos.y, pos.z)) pos.z -= dz;

    if (keys.Space && onGround) { vy = 8.5; }
    vy = Math.max(vy - 25 * dt, -30);
    onGround = false;
    pos.y += vy * dt;
    if (collides(pos.x, pos.y, pos.z)) {
      if (vy < 0) {
        pos.y = Math.floor(pos.y + 0.5) + 0.5 + EPS * 2; // stand on top of the block
        onGround = true;
      } else {
        pos.y = Math.floor(pos.y + H + 0.5) - 0.5 - H - EPS * 2; // bump head
      }
      vy = 0;
    }
    if (pos.y < -30) respawn();
  }

  function physics(dt) {
    dt = Math.min(dt, 0.05);
    const n = Math.ceil(dt / 0.016); // sub-steps so we never tunnel through blocks
    for (let i = 0; i < n; i++) step(dt / n);
  }

  // ---------- Input ----------
  const overlay = document.getElementById("overlay");
  const canvas = renderer.domElement;
  const locked = () => document.pointerLockElement === canvas;

  overlay.addEventListener("click", () => canvas.requestPointerLock());
  document.addEventListener("pointerlockchange", () => {
    overlay.classList.toggle("hidden", locked());
    if (!locked()) for (const k in keys) keys[k] = false;
  });

  document.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (e.code === "Space") e.preventDefault();
    if (/^Digit[0-9]$/.test(e.code)) { const d = Number(e.code.slice(5)); select(d === 0 ? 9 : d - 1); }
  });
  document.addEventListener("keyup", (e) => { keys[e.code] = false; });

  document.addEventListener("mousemove", (e) => {
    if (!locked()) return;
    yaw -= e.movementX * 0.0022;
    pitch = Math.max(-1.55, Math.min(1.55, pitch - e.movementY * 0.0022));
  });
  document.addEventListener("wheel", (e) => {
    if (locked()) select(selected + (e.deltaY > 0 ? 1 : -1));
  });
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  // ---------- Aiming / place / break ----------
  const raycaster = new THREE.Raycaster();
  raycaster.far = 8;
  const center = new THREE.Vector2(0, 0);
  let hit = null;

  function aim() {
    raycaster.setFromCamera(center, camera);
    const hits = raycaster.intersectObjects(world.children, false);
    hit = hits.length ? hits[0] : null;
    if (hit) {
      outline.position.copy(hit.object.position);
      outline.visible = true;
    } else {
      outline.visible = false;
    }
  }

  function overlapsPlayer(x, y, z) {
    return Math.abs(pos.x - x) < 0.5 + R && Math.abs(pos.z - z) < 0.5 + R &&
           pos.y < y + 0.5 && pos.y + H > y - 0.5;
  }

  const shooter = new THREE.Raycaster();
  shooter.far = 80;
  const dirV = new THREE.Vector3();
  let lastShot = 0, lastThrow = 0;

  function fireGun() {
    const now = performance.now();
    if (now - lastShot < 200) return;
    lastShot = now;
    camera.getWorldDirection(dirV);
    const origin = camera.position.clone().addScaledVector(dirV, 0.6);
    origin.y -= 0.15;
    shooter.set(camera.position, dirV);
    const blockHit = shooter.intersectObjects(world.children, false)[0];
    const playerHit = shooter.intersectObjects([...others.values()].map((o) => o.group), true)[0];
    let dist = blockHit ? blockHit.distance : shooter.far;
    let target = 0;
    if (playerHit && playerHit.distance < dist) { dist = playerHit.distance; target = playerHit.object.userData.pid; }
    const end = camera.position.clone().addScaledVector(dirV, dist);
    tracer(origin, end);
    send({ type: "shoot", ox: origin.x, oy: origin.y, oz: origin.z, tx: end.x, ty: end.y, tz: end.z, hit: target });
  }

  function throwGrenade() {
    const now = performance.now();
    if (now - lastThrow < 900) return;
    lastThrow = now;
    camera.getWorldDirection(dirV);
    send({ type: "throw",
      x: camera.position.x + dirV.x * 0.6, y: camera.position.y + dirV.y * 0.6 - 0.1, z: camera.position.z + dirV.z * 0.6,
      vx: dirV.x * 16, vy: dirV.y * 16 + 4, vz: dirV.z * 16 });
  }

  document.addEventListener("mousedown", (e) => {
    if (!locked()) return;
    if (selected === GUN) { if (e.button === 0) fireGun(); return; }
    if (selected === GRENADE) { if (e.button === 0) throwGrenade(); return; }
    if (!hit) return;
    const { x, y, z } = hit.object.userData;
    if (e.button === 0) {
      send({ type: "break", x, y, z });
    } else if (e.button === 2) {
      const n = hit.face.normal;
      const px = x + Math.round(n.x), py = y + Math.round(n.y), pz = z + Math.round(n.z);
      if (!overlapsPlayer(px, py, pz)) send({ type: "place", x: px, y: py, z: pz, c: selected });
    }
  });

  // ---------- Main loop ----------
  let last = performance.now();
  let sendTimer = 0;

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = (now - last) / 1000;
    last = now;

    physics(dt);
    stepNades(dt);
    updateFx(dt);

    camera.position.set(pos.x, pos.y + EYE, pos.z);
    camera.rotation.set(pitch, yaw, 0);
    if (locked()) aim();

    // Smooth other players toward their latest network position.
    const k = Math.min(1, dt * 12);
    for (const o of others.values()) {
      const g = o.group, t = o.target;
      g.position.x += (t.x - g.position.x) * k;
      g.position.y += (t.y - g.position.y) * k;
      g.position.z += (t.z - g.position.z) * k;
      let d = t.ry - g.rotation.y;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      g.rotation.y += d * k;
    }

    sendTimer += dt;
    if (sendTimer >= 0.05) { // 20 updates per second
      sendTimer = 0;
      send({ type: "move", x: pos.x, y: pos.y, z: pos.z, ry: yaw });
    }

    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
